<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챔의 달력</title>
<meta name="theme-color" content="#d5cfd6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2f2a3a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Griun_Cherry1Spoon-Rg.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 그리운 체리한스푼 (그리운, 무료·상업 이용 가능, 원본 파일 그대로) */
@font-face { font-family: "Griun Cherry1Spoon"; src: url("fonts/Griun_Cherry1Spoon-Rg.woff2") format("woff2"); font-display: swap; }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600&display=swap">
<style>
/* 한 줄 구성: 위는 밀어서 넘기는 달력, 아래는 고른 날의 일정·할 일, 맨 아래 빠른 추가. 눈부시지 않은 파스텔. */
:root {
  --bg: #d5cfd6;        /* dusty mauve-grey, dimmer than white */
  --surface: #dfd9df;
  --surface-2: #e7e2e6;
  --fg: #3a3540;
  --muted: #6f6874;
  --line: rgba(58, 53, 64, .12);
  --lav: #9d8fbd;       /* selection, default event colour */
  --lav-soft: #c6bcd9;
  --peach: #c99484;     /* open to-dos, Sunday */
  --mint: #86ae9b;      /* finished to-dos */
  --sky: #8199b8;       /* Saturday */
  --on-accent: #f3eff3;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --hand: "Griun Cherry1Spoon", "Gothic A1", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2f2a3a; --surface: #3a3447; --surface-2: #453e54;   /* dusky plum, pastel accents kept */
    --fg: #eee7f2; --muted: #b8adc6; --line: rgba(238, 231, 242, .10);
    --lav: #c4b5e6; --lav-soft: #5d5178; --peach: #ecbcaa; --mint: #acd8c2; --sky: #adc3e2;
    --on-accent: #2f2a3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2f2a3a; --surface: #3a3447; --surface-2: #453e54;
  --fg: #eee7f2; --muted: #b8adc6; --line: rgba(238, 231, 242, .10);
  --lav: #c4b5e6; --lav-soft: #5d5178; --peach: #ecbcaa; --mint: #acd8c2; --sky: #adc3e2;
  --on-accent: #2f2a3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 520px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month { display: flex; align-items: baseline; gap: 8px; }
.month h1 { margin: 0; font-family: var(--hand); font-size: 34px; line-height: 1.1; font-weight: 400; color: var(--lav); }
.month span { color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: .04em; }
.nav { display: flex; gap: 6px; }
.nav button {
  min-width: 40px; height: 40px; border-radius: 20px; background: var(--surface);
  display: grid; place-items: center; font-size: 15px; padding: 0 12px;
}
.nav button:active { background: var(--surface-2); }

/* grid */
.cal { background: var(--surface); border-radius: 22px; padding: 12px 6px 10px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.week, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.week div { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding-bottom: 8px; }
.week .sun { color: var(--peach); } .week .sat { color: var(--sky); }
.days { will-change: transform; }
.days.slide { transition: transform .22s ease-out, opacity .22s ease-out; }
.day {
  min-height: var(--cell-h, 64px); border-radius: 12px; font-weight: 500; min-width: 0;
  transition: min-height .34s cubic-bezier(.2,.8,.2,1); overflow-y: clip;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  padding: 4px 2px 4px; gap: 2px; font-size: 15px; font-variant-numeric: tabular-nums; position: relative;
}
.day.other { opacity: .35; }
.day.sun, .day.hol { color: var(--peach); }
.day.sat { color: var(--sky); }
.day .num { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; align-self: center; position: relative; }
.day.today .num { box-shadow: inset 0 0 0 1.5px var(--lav); }
.day.sel { background: var(--lav-soft); }
.day.sel .num { background: var(--lav); color: var(--on-accent); box-shadow: none; }
.day .num i { position: absolute; top: 1px; right: -3px; width: 6px; height: 6px; border-radius: 3px; }
.day .num i.t { background: var(--peach); } .day .num i.d { background: var(--mint); }
.chip {
  display: block; font-size: 10px; line-height: 15px; height: 15px; padding: 0 3px; border-radius: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; font-weight: 600; color: var(--on-accent); text-align: left;
}
.chip { height: var(--chip-h, 15px); line-height: var(--chip-h, 15px); transition: height .34s cubic-bezier(.2,.8,.2,1), line-height .34s cubic-bezier(.2,.8,.2,1); }
.chip b, .more { opacity: var(--chip-t, 1); transition: opacity .25s ease; }
.cal.drag .day, .cal.drag .chip, .cal.drag .chip b, .cal.drag .more { transition: none; }
.chip b { display: block; position: relative; z-index: 1; overflow: hidden; white-space: nowrap; font-weight: inherit; }
.chip.cl { margin-left: -3px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.chip.cr { margin-right: -3px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.chip.gap { visibility: hidden; }
.chip.wide { overflow: visible; }
.more { font-size: 10px; line-height: 12px; color: var(--muted); text-align: center; }
.c-lav { background: var(--lav); } .c-peach { background: var(--peach); } .c-mint { background: var(--mint); } .c-sky { background: var(--sky); }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); padding-top: 8px; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; }
.hint { font-size: 11px; color: var(--muted); text-align: center; opacity: .8; padding-top: 4px; }

/* 선택한 날의 목록 (작은 달력 아래) */
.app { padding-bottom: 130px; }
.daylist { display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 0; }
.dhead { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 2px; }
.dhead b { font-family: var(--hand); font-weight: 400; font-size: 32px; line-height: 1; color: var(--lav); }
.dhead span { font-size: 14px; color: var(--muted); font-weight: 600; }
.dhead small { font-size: 12px; color: var(--peach); font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: stretch; gap: 12px; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 12px 14px; }
.item:active { background: var(--surface-2); }
.item .bar { width: 4px; border-radius: 2px; flex: none; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .t { font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.item .s { font-size: 12.5px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.todo { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 6px 10px 6px 12px; }
.todo .chk {
  width: 26px; height: 26px; flex: none; border-radius: 13px; box-shadow: inset 0 0 0 1.5px var(--muted);
  display: grid; place-items: center; font-size: 14px; color: var(--on-accent);
}
.todo.done .chk { background: var(--mint); box-shadow: none; }
.todo .t2 { flex: 1; min-width: 0; text-align: left; font-size: 15px; line-height: 1.45; padding: 8px 0; overflow-wrap: anywhere; }
.todo.done .t2 { color: var(--muted); text-decoration: line-through; }
.sec { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; padding: 6px 8px 0; }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 0 6px; }

/* 빠른 추가 (맨 아래 입력줄) */
.quick {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; pointer-events: none;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.quick .wrap {
  pointer-events: auto; width: 100%; max-width: 440px; background: var(--surface-2); border-radius: 26px;
  box-shadow: 0 6px 22px rgba(20, 16, 26, .16), 0 0 0 1px var(--line);
}
.quick .pv { font-size: 12.5px; color: var(--lav); padding: 10px 20px 0; font-weight: 600; }
.quick .rowq { display: flex; align-items: center; gap: 6px; padding: 4px 5px 4px 20px; }
.quick input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; padding: 10px 0; outline: none; }
.plus { width: 42px; height: 42px; border-radius: 21px; background: var(--lav); color: var(--on-accent); font-size: 26px; line-height: 1; display: grid; place-items: center; flex: none; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }

/* 자세히 추가 창 */
#scrim { position: fixed; inset: 0; background: rgba(24, 20, 30, .42); z-index: 19; opacity: 0; transition: opacity .3s ease; }
#scrim.on { opacity: 1; }
body.locked { overflow: hidden; }
.editor {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 20;
  margin: 0 auto; max-width: 520px; background: var(--bg); border-radius: 26px 26px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(20, 16, 26, .2);
  transform: translateY(105%); transition: transform .36s cubic-bezier(.2,.8,.2,1);
}
.editor.up { transform: translateY(0); }
.editor.drag { transition: none; }
.grab { flex: none; height: 26px; position: relative; touch-action: none; }
.grab::before { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--muted); opacity: .45; }
.escroll {
  flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px));
}
.seg { display: flex; background: var(--surface); border-radius: 22px; padding: 4px; margin: 0 auto; width: min(260px, 100%); flex: none; touch-action: none; }
.seg button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--lav); color: var(--on-accent); }
.card { background: var(--surface); border-radius: 20px; padding: 2px 16px; }
.fr { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.fr:last-child { border-bottom: 0; }
.fr .lb { font-size: 14px; color: var(--muted); flex: none; min-width: 40px; }
.fr input[type="text"], .fr textarea, .fr select {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; padding: 12px 0; outline: none;
}
.fr select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.fr select option { background: var(--surface); color: var(--fg); }
#fTitle { font-size: 18px; font-weight: 600; }
#fTitle.need::placeholder { color: var(--peach); opacity: 1; }
.fr.memo { align-items: flex-start; }
.fr.memo .lb { padding-top: 13px; }
.fr textarea { resize: none; min-height: 76px; line-height: 1.5; }
.dots { display: flex; gap: 8px; flex: none; }
.dots button { width: 24px; height: 24px; border-radius: 12px; }
.dots button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.toggle { appearance: none; -webkit-appearance: none; margin: 0 0 0 auto; width: 48px; height: 28px; border-radius: 14px; background: var(--surface-2); position: relative; cursor: pointer; transition: background .2s ease; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: var(--muted); transition: transform .2s ease, background .2s ease; }
.toggle:checked { background: var(--lav); }
.toggle:checked::after { transform: translateX(20px); background: var(--on-accent); }
.range { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.range .col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.dbtn { font-size: 15px; font-weight: 600; padding: 6px 10px; border-radius: 14px; white-space: nowrap; }
.dbtn.on { background: var(--lav-soft); }
.tin { border: 0; background: none; color: var(--fg); font: inherit; font-size: 15px; text-align: center; padding: 4px 6px; border-radius: 12px; max-width: 100%; }
.arrow { color: var(--muted); font-size: 18px; }
.allday .tin { display: none; }
.mini { padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
.mh { display: flex; align-items: center; justify-content: space-between; padding: 0 0 6px; }
.mh b { font-weight: 600; font-size: 15px; }
.mh button { width: 38px; height: 38px; border-radius: 19px; font-size: 17px; }
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; }
.mg span { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
.mg button { height: 36px; font-size: 14px; font-variant-numeric: tabular-nums; }
.mg .o { opacity: .35; }
.mg .su, .mg .ho { color: var(--peach); } .mg .sa { color: var(--sky); }
.mg .in { background: var(--lav-soft); }
.mg .rs { border-top-left-radius: 18px; border-bottom-left-radius: 18px; }
.mg .re { border-top-right-radius: 18px; border-bottom-right-radius: 18px; }
.mg .pk { background: var(--lav); color: var(--on-accent); border-radius: 18px; }
.mg .in.pk { border-radius: 0; } .mg .in.pk.rs { border-radius: 18px 0 0 18px; } .mg .in.pk.re { border-radius: 0 18px 18px 0; } .mg .in.pk.rs.re { border-radius: 18px; }
.editor.todo .evonly { display: none; }
.editor:not(.todo) .todoonly { display: none; }
.delete { color: var(--peach); font-size: 14px; font-weight: 600; padding: 12px 18px; align-self: center; border-radius: 14px; }
.ebar { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
.pill { pointer-events: auto; display: flex; background: var(--surface-2); border-radius: 24px; box-shadow: 0 6px 22px rgba(20, 16, 26, .18), 0 0 0 1px var(--line); overflow: hidden; }
.pill button { min-width: 104px; height: 48px; font-size: 15px; font-weight: 600; }
.pill button + button { border-left: 1px solid var(--line); }
.pill .save { color: var(--lav); }

/* 확인 창 (변경사항을 저장할까요?) */
#askScrim { position: fixed; inset: 0; z-index: 29; background: rgba(24, 20, 30, .25); }
.ask {
  position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: 480px; margin: 0 auto; background: var(--surface); border-radius: 22px; padding: 20px 10px 10px;
  box-shadow: 0 10px 30px rgba(20, 16, 26, .25);
}
.ask p { margin: 0 12px 14px; font-size: 15px; font-weight: 500; }
.ask .btns { display: flex; gap: 4px; }
.ask .btns button { flex: 1; height: 46px; font-weight: 600; border-radius: 14px; }
.ask .btns button:last-child { color: var(--lav); }
.ask .btns button:active { background: var(--surface-2); }

.foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; padding-top: 8px; }
.note { margin: 0; text-align: center; font-size: 13px; color: var(--muted); min-height: 1em; }
.foot button { font-size: 13px; color: var(--muted); padding: 8px 12px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month"><h1 id="title"></h1><span id="year"></span></div>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <button id="today">오늘</button>
      <button id="next" aria-label="다음 달">›</button>
    </div>
  </header>

  <section class="cal" id="cal" aria-label="달력. 옆으로 밀면 달이 바뀌고, 위아래로 밀면 크기가 바뀌어요">
    <div class="week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
    <div class="days" id="days"></div>
    <div class="legend"><span><i style="background:var(--peach)"></i>할 일 남음</span><span><i style="background:var(--mint)"></i>할 일 다 했어요</span></div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="daylist" id="daylist" aria-live="polite">
    <div class="dhead" id="dayTitle"></div>
    <ul class="list" id="events"></ul>
    <div class="sec" id="todoSec">할 일</div>
    <ul class="list" id="todos"></ul>
    <p class="empty" id="dayEmpty">일정이 없어요. 아래에서 바로 추가해 보세요.</p>
  </section>

  <div class="foot">
    <button id="theme">화면 더 어둡게</button>
    <button id="backup">백업 저장</button>
    <button id="restore">백업 불러오기</button>
    <input type="file" id="restoreFile" accept="application/json,.json,text/plain,*/*" hidden>
  </div>
  <p class="note" id="note" aria-live="polite"></p>
</div>

<form class="quick" id="quick" autocomplete="off">
  <div class="wrap">
    <div class="pv" id="qPreview" hidden></div>
    <div class="rowq">
      <input id="qText" enterkeyhint="done" aria-label="빠른 추가. 예: 오후 6시 저녁">
      <button type="button" class="plus" id="qPlus" aria-label="자세히 추가">+</button>
    </div>
  </div>
</form>

<div id="scrim" hidden></div>
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-label="일정 추가" hidden>
  <div class="grab" id="grab" aria-hidden="true"></div>
  <div class="escroll" id="escroll">
    <div class="seg" id="seg" role="group" aria-label="종류">
      <button type="button" data-kind="event" aria-pressed="true">일정</button>
      <button type="button" data-kind="todo" aria-pressed="false">할 일</button>
    </div>
    <div class="card">
      <div class="fr">
        <input type="text" id="fTitle" placeholder="제목" enterkeyhint="done" autocomplete="off">
        <div class="dots" id="dots" role="group" aria-label="색">
          <button type="button" class="c-lav" data-c="lav" aria-label="라벤더"></button>
          <button type="button" class="c-peach" data-c="peach" aria-label="피치"></button>
          <button type="button" class="c-mint" data-c="mint" aria-label="민트"></button>
          <button type="button" class="c-sky" data-c="sky" aria-label="하늘"></button>
        </div>
      </div>
      <label class="fr evonly"><span class="lb">하루 종일</span><input type="checkbox" class="toggle" id="fAll" role="switch"></label>
      <div class="range evonly" id="range">
        <div class="col"><button type="button" class="dbtn" id="sDate"></button><input type="time" class="tin" id="sTime" aria-label="시작 시간"></div>
        <span class="arrow" aria-hidden="true">→</span>
        <div class="col"><button type="button" class="dbtn" id="eDate"></button><input type="time" class="tin" id="eTime" aria-label="끝 시간"></div>
      </div>
      <div class="fr todoonly"><span class="lb">날짜</span><button type="button" class="dbtn" id="tDate"></button></div>
      <div class="mini" id="mini" hidden>
        <div class="mh"><button type="button" id="mPrev" aria-label="이전 달">‹</button><b id="mTitle"></b><button type="button" id="mNext" aria-label="다음 달">›</button></div>
        <div class="mg" id="mGrid"></div>
      </div>
      <div class="fr evonly"><span class="lb">장소</span><input type="text" id="fPlace" placeholder="장소 (선택)" enterkeyhint="done" autocomplete="off"></div>
      <div class="fr evonly"><span class="lb">반복</span>
        <select id="fRepeat">
          <option value="">반복 안 함</option><option value="day">매일</option><option value="week">매주</option><option value="month">매월</option><option value="year">매년</option>
        </select>
      </div>
      <div class="fr evonly memo"><span class="lb">메모</span><textarea id="fMemo" placeholder="메모 (선택)" rows="3"></textarea></div>
    </div>
    <button type="button" class="delete" id="fDelete" hidden>지우기</button>
  </div>
  <div class="ebar"><div class="pill"><button type="button" id="fCancel">취소</button><button type="button" class="save" id="fSave">저장</button></div></div>
</section>

<script>
(function () {
  var KEY = 'cham-calendar-v1';
  var Cap = window.Capacitor;
  var native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  var Prefs = native && Cap.Plugins ? Cap.Plugins.Preferences : null;
  var store = {};

  // 저장: 앱에서는 폰 저장소(Preferences, 위젯도 읽을 수 있음), 웹에서는 브라우저 저장소
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function getItem(k) {
    if (!Prefs) return Promise.resolve(lsGet(k));
    return Prefs.get({ key: k }).then(function (r) { return r && r.value != null ? r.value : lsGet(k); }, function () { return lsGet(k); });
  }
  function setItem(k, v) {
    lsSet(k, v);
    if (Prefs) Prefs.set({ key: k, value: v }).catch(function () {});
  }
  function persist() { setItem(KEY, JSON.stringify(store)); }

  // 대한민국 공휴일 (2026–2027, 대체공휴일 포함)
  var HOL = {
    '2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴',
    '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날',
    '2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일',
    '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일',
    '2026-10-09':'한글날','2026-12-25':'성탄절',
    '2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일',
    '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일',
    '2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
    '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일',
    '2027-12-25':'성탄절','2027-12-27':'대체공휴일'
  };
  var COLORS = ['lav', 'peach', 'mint', 'sky'];
  var REPEAT = { day: '매일', week: '매주', month: '매월', year: '매년' };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function dn(k) { var p = k.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function kd(n) { var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function kDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var now = new Date();
  var view = new Date(now.getFullYear(), now.getMonth(), 1);
  var sel = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var $ = function (id) { return document.getElementById(id); };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(t) { var s = document.createElement('span'); s.textContent = t; return s.innerHTML; }

  // 저장된 기록 정리 (예전 메모는 하루 종일 일정으로 옮겨요)
  var TIME = /^\d{2}:\d{2}$/, DAY = /^\d{4}-\d{2}-\d{2}$/;
  function normalize(data) {
    var out = {};
    Object.keys(data || {}).forEach(function (k) {
      var e = data[k];
      if (!DAY.test(k) || !e || typeof e !== 'object') return;
      var events = Array.isArray(e.events) ? e.events.map(function (v) {
        var o = { id: String(v.id || uid()), title: String(v.title || ''), time: TIME.test(v.time) ? v.time : '', color: COLORS.indexOf(v.color) >= 0 ? v.color : 'lav' };
        if (DAY.test(v.end) && v.end > k) o.end = v.end;
        if (TIME.test(v.endTime)) o.endTime = v.endTime;
        if (v.place && String(v.place).trim()) o.place = String(v.place).trim().slice(0, 200);
        if (v.memo && String(v.memo).trim()) o.memo = String(v.memo).slice(0, 3000);
        if (REPEAT[v.repeat]) o.repeat = v.repeat;
        return o;
      }).filter(function (v) { return v.title.trim(); }) : [];
      if (e.memo && String(e.memo).trim()) events.push({ id: uid(), title: String(e.memo).trim(), time: '', color: 'lav' });
      var todos = Array.isArray(e.todos) ? e.todos.map(function (t) { return { id: String(t.id || uid()), text: String(t.text || ''), done: !!t.done }; }).filter(function (t) { return t.text.trim(); }) : [];
      if (events.length || todos.length) out[k] = { events: events, todos: todos };
    });
    return out;
  }
  function entry(k) { return store[k] || { events: [], todos: [] }; }
  function clean(k) { var e = store[k]; if (e && !e.events.length && !e.todos.length) delete store[k]; }
  function fmtTime(t) {
    if (!t) return '하루 종일';
    var h = +t.slice(0, 2), m = t.slice(3);
    return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + m;
  }
  function md(k) { var p = k.split('-'); return (+p[1]) + '월 ' + (+p[2]) + '일'; }
  function mdw(k) { return md(k) + ' (' + WD[kDate(k).getDay()] + ')'; }

  // 기간·반복을 펼쳐서 from~to 사이에 걸친 일정을 모두 구해요
  function occs(fromK, toK) {
    var out = [], f = dn(fromK), t = dn(toK);
    Object.keys(store).forEach(function (k) {
      var s0 = dn(k);
      store[k].events.forEach(function (v) {
        var dur = v.end && v.end > k ? dn(v.end) - s0 : 0;
        var add = function (st) { if (st >= s0 && st + dur >= f && st <= t) out.push({ v: v, s: kd(st), e: kd(st + dur), base: k }); };
        var r = v.repeat, lo = Math.max(s0, f - dur), n;
        if (!r) add(s0);
        else if (r === 'day') { for (n = lo; n <= t; n++) add(n); }
        else if (r === 'week') { for (n = lo + ((7 - (lo - s0) % 7) % 7); n <= t; n += 7) add(n); }
        else {
          var p = k.split('-'), y0 = +p[0], m0 = +p[1] - 1, dd = +p[2];
          var q = kd(lo).split('-'), y = +q[0], m = +q[1] - 1;
          if (r === 'year') { m = m0; if (y < y0) y = y0; }
          else if (y * 12 + m < y0 * 12 + m0) { y = y0; m = m0; }
          for (var g = 0; g < 600; g++) {
            var c = new Date(Date.UTC(y, m, dd));
            n = Math.round(c / 864e5);
            if (n > t) break;
            if (c.getUTCDate() === dd) add(n);
            if (r === 'year') y++; else { m++; if (m > 11) { m = 0; y++; } }
          }
        }
      });
    });
    return out;
  }
  function spanOrder(a, b) {
    var ma = a.e > a.s, mb = b.e > b.s;
    return a.s.localeCompare(b.s) || b.e.localeCompare(a.e) || (mb - ma) ||
      ((a.v.time ? 1 : 0) - (b.v.time ? 1 : 0)) || (a.v.time || '').localeCompare(b.v.time || '');
  }
  function dayList(k) {
    return occs(k, k).sort(function (a, b) {
      var ma = a.e > a.s, mb = b.e > b.s;
      return (mb - ma) || (ma && mb ? spanOrder(a, b) : 0) ||
        ((a.v.time ? 1 : 0) - (b.v.time ? 1 : 0)) || (a.v.time || '').localeCompare(b.v.time || '');
    });
  }

  // 달력 모양: 크게(일정 제목 보임) ↔ 작게(아래에 그날 일정)
  var compact = lsGet(KEY + '-view') === 'compact';
  var SMALL = 50, bigH = 64;
  function cellH() {
    var cal = $('cal'), days = $('days');
    var weeks = Math.max(1, Math.round(days.children.length / 7));
    var top = cal.getBoundingClientRect().top + window.scrollY;
    var extra = cal.offsetHeight - days.offsetHeight;
    var avail = window.innerHeight - top - extra - 16 - $('quick').offsetHeight;
    return Math.max(64, Math.floor(avail / weeks));
  }
  // t: 0 = 작은 달력, 1 = 큰 달력. 중간 값이면 그 사이 모양 (손가락 따라 움직일 때)
  function applyT(t) {
    var cal = $('cal');
    cal.style.setProperty('--cell-h', (SMALL + (bigH - SMALL) * t).toFixed(1) + 'px');
    cal.style.setProperty('--chip-h', (3 + 12 * t).toFixed(2) + 'px');
    cal.style.setProperty('--chip-t', Math.max(0, Math.min(1, (t - .45) / .55)).toFixed(3));
  }
  function applyView() {
    $('cal').classList.toggle('compact', compact);
    $('hint').textContent = compact ? '아래로 밀면 달력이 커져요' : '위로 밀면 그날 일정이 보여요';
    applyT(compact ? 0 : 1);
  }
  function setCompact(c) {
    if (c !== compact) { compact = c; lsSet(KEY + '-view', c ? 'compact' : 'big'); }
    applyView();
    if (!c) window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }

  function renderGrid() {
    $('title').textContent = (view.getMonth() + 1) + '월';
    $('year').textContent = view.getFullYear();
    var days = $('days'); days.innerHTML = '';
    var start = new Date(view); start.setDate(1 - view.getDay());
    var weeks = Math.ceil((view.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
    var gEnd = new Date(start); gEnd.setDate(start.getDate() + weeks * 7 - 1);
    var all = occs(key(start), key(gEnd));
    var maxL = Math.max(1, Math.min(5, Math.floor((bigH - 34) / 17)));
    for (var w = 0; w < weeks; w++) {
      var dk = [], dd = [];
      for (var j = 0; j < 7; j++) { var d0 = new Date(start); d0.setDate(start.getDate() + w * 7 + j); dd.push(d0); dk.push(key(d0)); }
      // 이번 주에 걸친 일정마다 줄(lane)을 정해서 기간 막대가 같은 높이로 이어지게
      var wk = all.filter(function (o) { return o.s <= dk[6] && o.e >= dk[0]; }).sort(spanOrder);
      var lanes = [], cells = [[], [], [], [], [], [], []], hidden = [0, 0, 0, 0, 0, 0, 0];
      wk.forEach(function (o) {
        var a = 0, b = 6;
        while (dk[a] < o.s) a++;
        while (dk[b] > o.e) b--;
        var L = 0;
        for (;; L++) {
          if (!lanes[L]) lanes[L] = [];
          var free = true;
          for (var x = a; x <= b; x++) if (lanes[L][x]) { free = false; break; }
          if (free) break;
        }
        for (var y = a; y <= b; y++) {
          lanes[L][y] = true;
          if (L < maxL) cells[y][L] = { o: o, first: y === a, n: b - a + 1 };
          else hidden[y]++;
        }
      });
      for (var i = 0; i < 7; i++) {
        var d = dd[i], k = dk[i], e = store[k];
        var b2 = document.createElement('button');
        b2.className = 'day';
        if (d.getMonth() !== view.getMonth()) b2.className += ' other';
        if (d.getDay() === 0) b2.className += ' sun';
        if (d.getDay() === 6) b2.className += ' sat';
        if (HOL[k]) b2.className += ' hol';
        if (k === key(now)) b2.className += ' today';
        if (k === key(sel)) b2.className += ' sel';
        var label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일' + (HOL[k] ? ' ' + HOL[k] : '');
        var dot = '', chips = '', cnt = 0;
        if (e && e.todos.length) dot = e.todos.every(function (t) { return t.done; }) ? '<i class="d"></i>' : '<i class="t"></i>';
        for (var L2 = 0; L2 < cells[i].length; L2++) {
          var c = cells[i][L2];
          if (!c) { chips += '<span class="chip gap"></span>'; continue; }
          cnt++;
          var cls = 'chip c-' + c.o.v.color + (c.o.s < k ? ' cl' : '') + (c.o.e > k ? ' cr' : '');
          var txt = '';
          if (c.first) txt = '<b' + (c.n > 1 ? ' style="width:calc(' + c.n + '00% + ' + (c.n - 1) * 4 + 'px)"' : '') + '>' + esc(c.o.v.title) + '</b>';
          if (c.first && c.n > 1) cls += ' wide';
          chips += '<span class="' + cls + '">' + txt + '</span>';
        }
        if (hidden[i]) chips += '<span class="more">+' + hidden[i] + '</span>';
        cnt += hidden[i];
        if (cnt) label += ', 일정 ' + cnt + '개';
        b2.setAttribute('aria-label', label);
        b2.innerHTML = '<span class="num">' + d.getDate() + dot + '</span>' + chips;
        b2.dataset.k = k;
        days.appendChild(b2);
      }
    }
    var nb = cellH();
    if (nb !== bigH) { bigH = nb; if (!$('cal').classList.contains('drag')) applyT(compact ? 0 : 1); renderGrid(); }
  }

  // 선택한 날의 일정·할 일 목록
  function whenText(o, k) {
    var v = o.v, parts = [];
    if (o.e > o.s) parts.push(md(o.s) + (v.time ? ' ' + fmtTime(v.time) : '') + ' ~ ' + md(o.e) + (v.endTime ? ' ' + fmtTime(v.endTime) : ''));
    else parts.push(v.time ? fmtTime(v.time) + (v.endTime ? ' ~ ' + fmtTime(v.endTime) : '') : '하루 종일');
    if (v.repeat) parts.push(REPEAT[v.repeat]);
    if (v.place) parts.push(v.place);
    return parts.join(' · ');
  }
  function renderDay() {
    var k = key(sel), e = entry(k);
    $('dayTitle').innerHTML = '<b>' + sel.getDate() + '</b><span>' + (sel.getMonth() + 1) + '월 ' + WD[sel.getDay()] + '요일</span>' + (HOL[k] ? '<small>' + HOL[k] + '</small>' : '');
    var ul = $('events'); ul.innerHTML = '';
    var evs = dayList(k);
    evs.forEach(function (o) {
      var li = document.createElement('li');
      var b = document.createElement('button'); b.type = 'button'; b.className = 'item';
      b.innerHTML = '<span class="bar c-' + o.v.color + '"></span><span class="body"><span class="t">' + esc(o.v.title) + '</span><span class="s">' + esc(whenText(o, k)) + '</span></span>';
      b.setAttribute('aria-label', o.v.title + ', ' + whenText(o, k) + '. 눌러서 고치기');
      b.onclick = function () { openEditor(fromEvent(o)); };
      li.appendChild(b); ul.appendChild(li);
    });
    var tl = $('todos'); tl.innerHTML = '';
    e.todos.forEach(function (t) {
      var li = document.createElement('li'); li.className = 'todo' + (t.done ? ' done' : '');
      var chk = document.createElement('button'); chk.type = 'button'; chk.className = 'chk'; chk.textContent = t.done ? '✓' : '';
      chk.setAttribute('aria-label', t.text + (t.done ? ' 완료 취소' : ' 완료'));
      chk.onclick = function () { t.done = !t.done; persist(); render(); };
      var tx = document.createElement('button'); tx.type = 'button'; tx.className = 't2'; tx.textContent = t.text; tx.setAttribute('aria-label', t.text + ' 고치기');
      tx.onclick = function () { openEditor({ kind: 'todo', id: t.id, base: k, title: t.text, tK: k, done: t.done }); };
      li.appendChild(chk); li.appendChild(tx); tl.appendChild(li);
    });
    $('todoSec').hidden = !e.todos.length;
    $('dayEmpty').hidden = !!(evs.length || e.todos.length);
    $('qText').placeholder = md(k) + '에 추가';
  }
  function render() { renderGrid(); renderDay(); }

  // 날짜 누르기: 목록만 그날로 (큰 달력이면 부드럽게 작아지면서)
  var dragged = false;
  $('days').addEventListener('click', function (ev) {
    if (dragged) { dragged = false; return; }
    var b = ev.target.closest('.day'); if (!b) return;
    var k = b.dataset.k;
    sel = kDate(k);
    if (sel.getMonth() !== view.getMonth()) {
      go(sel.getFullYear() * 12 + sel.getMonth() > view.getFullYear() * 12 + view.getMonth() ? 1 : -1, true);
      if (!compact) setCompact(true);
      render(); return;
    }
    if (!compact) {
      Array.prototype.forEach.call(document.querySelectorAll('.day.sel'), function (x) { x.classList.remove('sel'); });
      b.classList.add('sel'); renderDay(); setCompact(true); return;
    }
    render();
  });

  // 달 넘기기 (버튼 + 스와이프)
  function go(dir, silent) {
    view = new Date(view.getFullYear(), view.getMonth() + dir, 1);
    if (silent) return;
    var days = $('days');
    if (reduce) { renderGrid(); return; }
    days.classList.remove('slide');
    days.style.transform = 'translateX(' + (dir * 40) + '%)'; days.style.opacity = '0';
    renderGrid();
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      days.classList.add('slide'); days.style.transform = ''; days.style.opacity = '';
    }); });
  }
  $('prev').onclick = function () { go(-1); };
  $('next').onclick = function () { go(1); };
  $('today').onclick = function () {
    now = new Date();
    sel = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    view = new Date(now.getFullYear(), now.getMonth(), 1);
    render();
  };

  (function swipe() {
    var cal = $('cal'), days = $('days'), x0 = 0, y0 = 0, dx = 0, mode = null, id = null;
    var t0 = 0, t = 0, lastY = 0, lastT = 0, vy = 0;
    cal.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; dragged = false;
    });
    cal.addEventListener('pointermove', function (e) {
      if (e.pointerId !== id) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.2) { mode = 'x'; try { cal.setPointerCapture(id); } catch (er) {} }
        else if (Math.abs(my) > 10) {
          mode = 'y'; try { cal.setPointerCapture(id); } catch (er) {}
          t0 = compact ? 0 : 1; y0 = e.clientY; lastY = e.clientY; lastT = e.timeStamp; vy = 0;
          cal.classList.add('drag');
        }
      }
      if (mode === 'y') {
        var weeks = Math.max(1, Math.round(days.children.length / 7));
        t = Math.max(0, Math.min(1, t0 + (e.clientY - y0) / (weeks * (bigH - SMALL))));
        var dt = e.timeStamp - lastT;
        if (dt > 0) vy = .7 * vy + .3 * ((e.clientY - lastY) / dt);
        lastY = e.clientY; lastT = e.timeStamp;
        applyT(t);
      }
      if (mode === 'x') { dx = mx; days.classList.remove('slide'); days.style.transform = 'translateX(' + dx + 'px)'; days.style.opacity = String(1 - Math.min(Math.abs(dx) / 400, .5)); }
    });
    function end(e) {
      if (e.pointerId !== id) return; id = null;
      if (mode === 'y') {
        dragged = true; setTimeout(function () { dragged = false; }, 50);
        // 빠르게 튕기면 그 방향으로, 아니면 반 넘게 움직였을 때만 바뀌어요
        var big = vy > .35 ? true : vy < -.35 ? false : t > .5;
        void cal.offsetHeight;
        cal.classList.remove('drag');
        setCompact(!big);
        return;
      }
      if (mode !== 'x') return;
      dragged = true; setTimeout(function () { dragged = false; }, 50);
      var w = cal.clientWidth;
      if (Math.abs(dx) > Math.min(70, w * .18)) {
        var dir = dx < 0 ? 1 : -1;
        if (reduce) { days.style.transform = ''; days.style.opacity = ''; go(dir); return; }
        days.classList.add('slide'); days.style.transform = 'translateX(' + (-dir * w) + 'px)'; days.style.opacity = '0';
        setTimeout(function () { go(dir); }, 180);
      } else {
        days.classList.add('slide'); days.style.transform = ''; days.style.opacity = '';
      }
    }
    cal.addEventListener('pointerup', end);
    cal.addEventListener('pointercancel', end);
  })();

  // ───── 빠른 추가: "오후 6시 저녁", "내일 7시 반 운동", "12월 3일 병원" ─────
  function parseQuick(text) {
    var s = ' ' + text + ' ', d = new Date(sel), time = '';
    var rel = { '오늘': 0, '내일': 1, '모레': 2, '글피': 3 };
    s = s.replace(/(^|\s)(오늘|내일|모레|글피)(?=\s|$)/, function (m, a, w) { d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + rel[w]); return a; });
    s = s.replace(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, function (m, mo, da) {
      var c = new Date(sel.getFullYear(), +mo - 1, +da);
      if (c.getMonth() === +mo - 1) d = c;
      return ' ';
    });
    var pm = /저녁|밤/.test(s);
    s = s.replace(/(오전|오후|아침|낮|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시\s*(?:(\d{1,2})\s*분|(반))?)/, function (m, ap, h, mm1, mm2, half) {
      h = +h; var mi = mm1 ? +mm1 : mm2 ? +mm2 : half ? 30 : 0;
      if (h > 24 || mi > 59) return m;
      if (ap === '오후' || ap === '저녁' || ap === '밤' || (!ap && pm)) { if (h < 12) h += 12; }
      else if (ap === '낮') { if (h < 6) h += 12; }
      else if (ap === '오전' || ap === '아침' || ap === '새벽') { if (h === 12) h = 0; }
      else if (h >= 1 && h <= 6) h += 12;   // "3시 회의" → 오후 3시
      if (h === 24) h = 0;
      time = pad(h) + ':' + pad(mi);
      return ' ';
    });
    var title = s.replace(/\s+/g, ' ').trim() || text.trim();
    return { title: title, k: key(d), time: time };
  }
  function quickPreview() {
    var v = $('qText').value.trim(), pv = $('qPreview');
    if (!v) { pv.hidden = true; return; }
    var q = parseQuick(v);
    pv.textContent = mdw(q.k) + ' · ' + (q.time ? fmtTime(q.time) : '하루 종일') + ' · ' + q.title;
    pv.hidden = false;
  }
  $('qText').addEventListener('input', quickPreview);
  $('quick').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = $('qText').value.trim();
    if (!v) { openEditor({}); return; }
    var q = parseQuick(v), e = entry(q.k);
    e.events.push({ id: uid(), title: q.title, time: q.time, color: 'lav' });
    store[q.k] = e; persist();
    sel = kDate(q.k); view = new Date(sel.getFullYear(), sel.getMonth(), 1);
    $('qText').value = ''; quickPreview(); $('qText').blur();
    render(); note(mdw(q.k) + '에 "' + q.title + '" 추가했어요.');
  });
  $('qPlus').onclick = function () {
    var v = $('qText').value.trim(), o = {};
    if (v) { var q = parseQuick(v); o = { title: q.title, sK: q.k, eK: q.k, tK: q.k }; if (q.time) { o.allDay = false; o.sT = q.time; o.eT = addHour(q.time); } }
    $('qText').value = ''; quickPreview(); $('qText').blur();
    openEditor(o);
  };

  // ───── 자세히 추가 창 ─────
  var ed = null, edSnap = '', edOpen = false, miniFor = null, miniView = null;
  var editor = $('editor'), scrim = $('scrim');
  function addHour(t) { var h = +t.slice(0, 2) + 1; return h > 23 ? '23:59' : pad(h) + t.slice(2); }
  function nextHour() { var h = new Date().getHours() + 1; return h > 23 ? '23:00' : pad(h) + ':00'; }
  function fromEvent(o) {
    var v = o.v;
    return { kind: 'event', id: v.id, base: o.base, title: v.title, color: v.color, allDay: !v.time,
      sK: o.base, eK: v.end || o.base, sT: v.time || '', eT: v.endTime || '', place: v.place || '', repeat: v.repeat || '', memo: v.memo || '' };
  }
  function openEditor(o) {
    var k = key(sel);
    ed = { kind: 'event', id: null, base: null, title: '', color: 'lav', allDay: true, sK: k, eK: k, sT: '', eT: '', place: '', repeat: '', memo: '', tK: k, done: false };
    Object.keys(o || {}).forEach(function (x) { ed[x] = o[x]; });
    miniFor = null;
    $('fTitle').classList.remove('need');
    fillEditor(); edSnap = snap();
    edOpen = true;
    editor.hidden = false; scrim.hidden = false; document.body.classList.add('locked');
    $('escroll').scrollTop = 0;
    try { history.pushState({ ed: 1 }, ''); } catch (e) {}
    void editor.offsetHeight;
    editor.classList.add('up'); scrim.classList.add('on');
    if (!ed.id) setTimeout(function () { if (edOpen) $('fTitle').focus(); }, 380);
  }
  function closeEditor(fromBack) {
    if (!edOpen) return;
    edOpen = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    editor.classList.remove('up', 'drag'); editor.style.transform = ''; scrim.classList.remove('on'); scrim.style.opacity = '';
    setTimeout(function () { if (edOpen) return; editor.hidden = true; scrim.hidden = true; document.body.classList.remove('locked'); }, reduce ? 0 : 360);
    if (!fromBack) { try { if (history.state && history.state.ed) history.back(); } catch (e) {} }
  }
  function readEditor() {
    if (!ed) return;
    ed.title = $('fTitle').value; ed.place = $('fPlace').value; ed.memo = $('fMemo').value; ed.repeat = $('fRepeat').value;
    ed.allDay = $('fAll').checked; ed.sT = $('sTime').value; ed.eT = $('eTime').value;
  }
  function snap() { readEditor(); return JSON.stringify(ed); }
  function fillEditor() {
    editor.classList.toggle('todo', ed.kind === 'todo');
    editor.setAttribute('aria-label', (ed.id ? '' : '새 ') + (ed.kind === 'todo' ? '할 일' : '일정'));
    $('seg').hidden = !!ed.id;
    Array.prototype.forEach.call($('seg').children, function (b) { b.setAttribute('aria-pressed', b.dataset.kind === ed.kind ? 'true' : 'false'); });
    $('fTitle').value = ed.title; $('fTitle').placeholder = ed.kind === 'todo' ? '할 일' : '제목';
    Array.prototype.forEach.call($('dots').children, function (b) { b.setAttribute('aria-pressed', b.dataset.c === ed.color ? 'true' : 'false'); });
    $('dots').hidden = ed.kind === 'todo';
    $('fAll').checked = ed.allDay;
    $('range').classList.toggle('allday', ed.allDay);
    $('sDate').textContent = mdw(ed.sK); $('eDate').textContent = mdw(ed.eK); $('tDate').textContent = mdw(ed.tK);
    $('sTime').value = ed.sT; $('eTime').value = ed.eT;
    $('fPlace').value = ed.place; $('fRepeat').value = ed.repeat; $('fMemo').value = ed.memo;
    $('fDelete').hidden = !ed.id;
    $('sDate').classList.toggle('on', miniFor === 's'); $('eDate').classList.toggle('on', miniFor === 'e'); $('tDate').classList.toggle('on', miniFor === 't');
    renderMini();
  }
  // 창 안의 작은 달력
  function renderMini() {
    var m = $('mini');
    if (!miniFor) { m.hidden = true; return; }
    m.hidden = false;
    // 할 일 날짜 칸 바로 밑, 일정 기간 칸 바로 밑에 펼쳐져요
    var anchor = miniFor === 't' ? $('tDate').parentNode : $('range');
    if (anchor.nextSibling !== m) anchor.parentNode.insertBefore(m, anchor.nextSibling);
    $('mTitle').textContent = miniView.getFullYear() + '년 ' + (miniView.getMonth() + 1) + '월';
    var g = $('mGrid'), h = '';
    WD.forEach(function (w) { h += '<span>' + w + '</span>'; });
    var st = new Date(miniView); st.setDate(1 - miniView.getDay());
    for (var i = 0; i < 42; i++) {
      var d = new Date(st); d.setDate(st.getDate() + i); var k = key(d), c = [];
      if (d.getMonth() !== miniView.getMonth()) c.push('o');
      if (d.getDay() === 0) c.push('su'); if (d.getDay() === 6) c.push('sa'); if (HOL[k]) c.push('ho');
      if (miniFor === 't') { if (k === ed.tK) c.push('pk'); }
      else {
        if (k >= ed.sK && k <= ed.eK && ed.eK > ed.sK) c.push('in');
        if (k === ed.sK) c.push('pk', 'rs'); if (k === ed.eK) c.push('pk', 're');
      }
      h += '<button type="button" class="' + c.join(' ') + '" data-k="' + k + '" aria-label="' + md(k) + '">' + d.getDate() + '</button>';
    }
    g.innerHTML = h;
  }
  $('mGrid').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var k = b.dataset.k; readEditor();
    if (miniFor === 's') { var dur = dn(ed.eK) - dn(ed.sK); ed.sK = k; ed.eK = kd(dn(k) + dur); }
    else if (miniFor === 'e') { if (k < ed.sK) ed.sK = k; ed.eK = k; }
    else ed.tK = k;
    var kk = kDate(k); if (kk.getMonth() !== miniView.getMonth()) miniView = new Date(kk.getFullYear(), kk.getMonth(), 1);
    fillEditor();
  });
  $('mPrev').onclick = function () { miniView = new Date(miniView.getFullYear(), miniView.getMonth() - 1, 1); renderMini(); };
  $('mNext').onclick = function () { miniView = new Date(miniView.getFullYear(), miniView.getMonth() + 1, 1); renderMini(); };
  function toggleMini(which, k) {
    readEditor();
    miniFor = miniFor === which ? null : which;
    var d = kDate(k); miniView = new Date(d.getFullYear(), d.getMonth(), 1);
    fillEditor();
  }
  $('sDate').onclick = function () { toggleMini('s', ed.sK); };
  $('eDate').onclick = function () { toggleMini('e', ed.eK); };
  $('tDate').onclick = function () { toggleMini('t', ed.tK); };
  $('seg').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || ed.id) return;
    readEditor(); ed.kind = b.dataset.kind; miniFor = null; fillEditor();
  });
  $('dots').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b) return; readEditor(); ed.color = b.dataset.c; fillEditor(); });
  $('fAll').addEventListener('change', function () {
    readEditor();
    if (!ed.allDay && !ed.sT) { ed.sT = nextHour(); ed.eT = addHour(ed.sT); }
    fillEditor();
  });
  $('sTime').addEventListener('change', function () {
    readEditor();
    if (ed.sT && ed.sK === ed.eK && (!ed.eT || ed.eT <= ed.sT)) { ed.eT = addHour(ed.sT); $('eTime').value = ed.eT; }
  });
  $('fTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); this.blur(); } });
  $('fPlace').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); this.blur(); } });

  function saveEditor() {
    readEditor();
    var title = ed.title.trim();
    if (!title) { $('fTitle').classList.add('need'); $('fTitle').placeholder = ed.kind === 'todo' ? '할 일을 적어 주세요' : '제목을 적어 주세요'; $('fTitle').focus(); return; }
    var go2;
    if (ed.kind === 'event') {
      var obj = { id: ed.id || uid(), title: title, time: ed.allDay ? '' : (ed.sT || ''), color: ed.color };
      if (!ed.allDay && ed.eT) obj.endTime = ed.eT;
      if (ed.eK > ed.sK) obj.end = ed.eK;
      if (ed.place.trim()) obj.place = ed.place.trim();
      if (ed.memo.trim()) obj.memo = ed.memo;
      if (ed.repeat) obj.repeat = ed.repeat;
      if (ed.id && ed.base) { var old = entry(ed.base); old.events = old.events.filter(function (x) { return x.id !== ed.id; }); store[ed.base] = old; clean(ed.base); }
      var e = entry(ed.sK); e.events.push(obj); store[ed.sK] = e; go2 = ed.sK;
    } else {
      var t = { id: ed.id || uid(), text: title, done: !!ed.done }, pos = -1;
      if (ed.id && ed.base) {
        var ob = entry(ed.base); pos = ob.todos.findIndex(function (x) { return x.id === ed.id; });
        ob.todos = ob.todos.filter(function (x) { return x.id !== ed.id; }); store[ed.base] = ob; clean(ed.base);
        if (ed.base !== ed.tK) pos = -1;
      }
      var e2 = entry(ed.tK);
      if (pos >= 0) e2.todos.splice(pos, 0, t); else e2.todos.push(t);
      store[ed.tK] = e2; go2 = ed.tK;
    }
    persist();
    sel = kDate(go2); view = new Date(sel.getFullYear(), sel.getMonth(), 1);
    closeEditor(); render();
  }
  function deleteItem() {
    ask(ed.kind === 'todo' ? '이 할 일을 지울까요?' : (ed.repeat ? '반복되는 일정 전체를 지울까요?' : '이 일정을 지울까요?'), ['취소', '지우기']).then(function (i) {
      if (i !== 1) return;
      var en = entry(ed.base);
      if (ed.kind === 'todo') en.todos = en.todos.filter(function (x) { return x.id !== ed.id; });
      else en.events = en.events.filter(function (x) { return x.id !== ed.id; });
      store[ed.base] = en; clean(ed.base); persist(); closeEditor(); render();
    });
  }
  function tryClose() {
    if (snap() === edSnap) { closeEditor(); return; }
    ask('변경사항을 저장할까요?', ['취소', '저장 안 함', '저장']).then(function (i) {
      if (i === 1) closeEditor(); else if (i === 2) saveEditor();
    });
  }
  $('fSave').onclick = saveEditor;
  $('fCancel').onclick = tryClose;
  $('fDelete').onclick = deleteItem;
  scrim.addEventListener('click', tryClose);

  // 위쪽 손잡이를 아래로 끌어내리면 닫혀요
  (function () {
    var y0 = 0, dy = 0, pid = null;
    function down(e) {
      if (!edOpen || e.target.closest('button, input, select, textarea')) return;
      pid = e.pointerId; y0 = e.clientY; dy = 0;
      try { e.currentTarget.setPointerCapture(pid); } catch (er) {}
      editor.classList.add('drag');
    }
    function move(e) {
      if (e.pointerId !== pid) return;
      dy = Math.max(0, e.clientY - y0);
      editor.style.transform = 'translateY(' + dy + 'px)';
      scrim.style.opacity = String(Math.max(0, 1 - dy / 500));
    }
    function up(e) {
      if (e.pointerId !== pid) return; pid = null;
      editor.classList.remove('drag'); editor.style.transform = ''; scrim.style.opacity = '';
      if (dy > 110) tryClose();
    }
    [$('grab'), $('seg')].forEach(function (el) {
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  })();

  // 확인 창
  var askDone = null;
  function ask(msg, labels) {
    return new Promise(function (resolve) {
      closeAsk(0);
      var sc = document.createElement('div'); sc.id = 'askScrim';
      var box = document.createElement('div'); box.className = 'ask'; box.setAttribute('role', 'alertdialog');
      box.innerHTML = '<p>' + esc(msg) + '</p><div class="btns"></div>';
      labels.forEach(function (l, i) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = l;
        b.onclick = function () { closeAsk(i); };
        box.lastChild.appendChild(b);
      });
      sc.onclick = function () { closeAsk(0); };
      document.body.appendChild(sc); document.body.appendChild(box);
      askDone = function (i) { sc.remove(); box.remove(); resolve(i); };
      box.lastChild.lastChild.focus();
    });
  }
  function closeAsk(i) { if (askDone) { var f = askDone; askDone = null; f(i); } }

  // 폰의 뒤로가기: 확인 창 → 추가 창 순서로 닫혀요
  window.addEventListener('popstate', function () {
    if (!edOpen) return;
    if (askDone) { closeAsk(0); try { history.pushState({ ed: 1 }, ''); } catch (e) {} return; }
    if (snap() === edSnap) { closeEditor(true); return; }
    try { history.pushState({ ed: 1 }, ''); } catch (e) {}
    tryClose();
  });

  // 자판이 올라와도 쓰고 있는 칸이 보이게
  function keepVisible() {
    var el = document.activeElement;
    if (!edOpen || !el || !/INPUT|TEXTAREA|SELECT/.test(el.tagName) || !editor.contains(el)) return;
    var sc = $('escroll'), vv = window.visualViewport, vh = vv ? vv.height : window.innerHeight;
    var r = el.getBoundingClientRect(), limit = Math.min(sc.getBoundingClientRect().bottom, vh) - 80;
    if (r.bottom > limit) sc.scrollTop += r.bottom - limit + 8;
  }
  editor.addEventListener('focusin', function () { setTimeout(keepVisible, 320); });
  (window.visualViewport || window).addEventListener('resize', function () { setTimeout(keepVisible, 60); });

  // 화면 밝기: 기본(차분한 파스텔) ↔ 더 어둡게
  var root = document.documentElement;
  function applyTheme(t) {
    if (t === 'dark') root.setAttribute('data-theme', 'dark'); else if (t === 'light') root.setAttribute('data-theme', 'light');
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.hasAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    $('theme').textContent = dark ? '화면 조금 밝게' : '화면 더 어둡게';
  }
  $('theme').onclick = function () {
    var t = $('theme').textContent === '화면 조금 밝게' ? 'light' : 'dark';
    setItem(KEY + '-theme', t); applyTheme(t);
  };

  // 백업: 파일로 저장 / 불러오기
  function note(t) { $('note').textContent = t; clearTimeout(note.t); note.t = setTimeout(function () { $('note').textContent = ''; }, 5000); }
  $('backup').onclick = function () {
    var json = JSON.stringify({ app: 'cham-calendar', v: 3, data: store }, null, 1);
    var name = 'cham-calendar-backup-' + key(new Date()) + '.json';
    if (native && Cap.Plugins.Filesystem && Cap.Plugins.Share) {
      Cap.Plugins.Filesystem.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' })
        .then(function (r) { return Cap.Plugins.Share.share({ title: '챔의 달력 백업', files: [r.uri], dialogTitle: '백업 파일을 보낼 곳을 골라요' }); })
        .then(function () { note('백업 파일을 보냈어요.'); }, function (err) { if (!/cancel/i.test(String(err && err.message))) note('백업을 만들지 못했어요. 다시 눌러 주세요.'); });
      return;
    }
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    note('백업 파일을 다운로드 폴더에 저장했어요.');
  };
  $('restore').onclick = function () { $('restoreFile').click(); };
  $('restoreFile').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (!j || j.app !== 'cham-calendar' || typeof j.data !== 'object') throw 0;
        var data = normalize(j.data), n = 0;
        Object.keys(data).forEach(function (k) { store[k] = data[k]; n++; });
        persist(); render(); note(n + '일치 기록을 불러왔어요.');
      } catch (err) { note('이 파일은 챔의 달력 백업 파일이 아니에요.'); }
    };
    r.readAsText(f); this.value = '';
  };

  // 날짜가 바뀐 뒤 다시 열면 오늘 표시를 고쳐요
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && key(new Date()) !== key(now)) { now = new Date(); renderGrid(); }
  });
  window.addEventListener('resize', function () {
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    renderGrid();
  });

  if (!native) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  }

  applyView();
  Promise.all([getItem(KEY), getItem(KEY + '-theme')]).then(function (v) {
    var raw = {};
    try { raw = JSON.parse(v[0] || '{}') || {}; } catch (e) { raw = {}; }
    store = normalize(raw);
    if (v[0] && JSON.stringify(store) !== v[0]) persist();
    applyTheme(v[1]);
    render();
  });
  render();
})();
