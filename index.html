<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챔의 달력</title>
<meta name="theme-color" content="#d5cfd6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2f2a3a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Griun_Cherry1Spoon-Rg.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 그리운 체리한스푼 (그리운, 무료·상업 이용 가능, 원본 파일 그대로) */
@font-face { font-family: "Griun Cherry1Spoon"; src: url("fonts/Griun_Cherry1Spoon-Rg.woff2") format("woff2"); font-display: swap; }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600&display=swap">
<style>
/* Layout: one column, swipeable month grid on top, the chosen day's schedule + to-dos underneath. Muted, low-glare pastels. */
:root {
  --bg: #d5cfd6;        /* dusty mauve-grey, dimmer than white */
  --surface: #dfd9df;
  --surface-2: #e7e2e6;
  --fg: #3a3540;
  --muted: #6f6874;
  --line: rgba(58, 53, 64, .12);
  --lav: #9d8fbd;       /* selection, default event colour */
  --lav-soft: #c6bcd9;
  --peach: #c99484;     /* open to-dos, Sunday */
  --mint: #86ae9b;      /* finished to-dos */
  --sky: #8199b8;       /* Saturday */
  --on-accent: #f3eff3;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --hand: "Griun Cherry1Spoon", "Gothic A1", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2f2a3a; --surface: #3a3447; --surface-2: #453e54;   /* dusky plum, pastel accents kept */
    --fg: #eee7f2; --muted: #b8adc6; --line: rgba(238, 231, 242, .10);
    --lav: #c4b5e6; --lav-soft: #5d5178; --peach: #ecbcaa; --mint: #acd8c2; --sky: #adc3e2;
    --on-accent: #2f2a3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2f2a3a; --surface: #3a3447; --surface-2: #453e54;
  --fg: #eee7f2; --muted: #b8adc6; --line: rgba(238, 231, 242, .10);
  --lav: #c4b5e6; --lav-soft: #5d5178; --peach: #ecbcaa; --mint: #acd8c2; --sky: #adc3e2;
  --on-accent: #2f2a3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 520px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month { display: flex; align-items: baseline; gap: 8px; }
.month h1 { margin: 0; font-family: var(--hand); font-size: 34px; line-height: 1.1; font-weight: 400; color: var(--lav); }
.month span { color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: .04em; }
.nav { display: flex; gap: 6px; }
.nav button {
  min-width: 40px; height: 40px; border-radius: 20px; background: var(--surface);
  display: grid; place-items: center; font-size: 15px; padding: 0 12px;
}
.nav button:active { background: var(--surface-2); }

/* grid */
.cal { background: var(--surface); border-radius: 22px; padding: 12px 6px 10px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.week, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.week div { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding-bottom: 8px; }
.week .sun { color: var(--peach); } .week .sat { color: var(--sky); }
.days { will-change: transform; }
.days.slide { transition: transform .22s ease-out, opacity .22s ease-out; }
.day {
  min-height: var(--cell-h, 64px); border-radius: 12px; font-weight: 500; min-width: 0;
  transition: min-height .34s cubic-bezier(.2,.8,.2,1); overflow-y: clip;
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  padding: 4px 2px 4px; gap: 2px; font-size: 15px; font-variant-numeric: tabular-nums; position: relative;
}
.day.other { opacity: .35; }
.day.sun, .day.hol { color: var(--peach); }
.day.sat { color: var(--sky); }
.day .num { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; align-self: center; position: relative; }
.day.today .num { box-shadow: inset 0 0 0 1.5px var(--lav); }
.day.sel { background: var(--lav-soft); }
.day.sel .num { background: var(--lav); color: var(--on-accent); box-shadow: none; }
.day .num i { position: absolute; top: 1px; right: -3px; width: 6px; height: 6px; border-radius: 3px; }
.day .num i.t { background: var(--peach); } .day .num i.d { background: var(--mint); }
.chip {
  display: block; font-size: 10px; line-height: 15px; height: 15px; padding: 0 3px; border-radius: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; font-weight: 600; color: var(--on-accent); text-align: left;
}
.chip { height: var(--chip-h, 15px); line-height: var(--chip-h, 15px); transition: height .34s cubic-bezier(.2,.8,.2,1), line-height .34s cubic-bezier(.2,.8,.2,1); }
.chip b, .more { opacity: var(--chip-t, 1); transition: opacity .25s ease; }
.cal.drag .day, .cal.drag .chip, .cal.drag .chip b, .cal.drag .more { transition: none; }
.chip b { display: block; position: relative; z-index: 1; overflow: hidden; white-space: nowrap; font-weight: inherit; }
.chip.cl { margin-left: -3px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.chip.cr { margin-right: -3px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.chip.gap { visibility: hidden; }
.chip.wide { overflow: visible; }
.more { font-size: 10px; line-height: 12px; color: var(--muted); text-align: center; }
.c-lav { background: var(--lav); } .c-peach { background: var(--peach); } .c-mint { background: var(--mint); } .c-sky { background: var(--sky); }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); padding-top: 8px; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; }
.hint { font-size: 11px; color: var(--muted); text-align: center; opacity: .8; padding-top: 4px; }

/* day panel */
.panel { background: var(--surface); border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-family: var(--hand); font-size: 24px; line-height: 1.3; font-weight: 400; text-wrap: balance; }
.panel .grab, .panel .x { display: none; }
#scrim { position: fixed; inset: 0; background: rgba(24, 20, 30, .42); z-index: 19; opacity: 0; transition: opacity .28s ease; }
#scrim.on { opacity: 1; }
.panel.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0 auto; width: 100%; max-width: 520px;
  max-height: 86vh; max-height: 86dvh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 24px 24px 0 0; padding-top: 8px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 -8px 30px rgba(20, 16, 26, .18);
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1);
}
.panel.sheet.up { transform: translateY(0); }
.panel.sheet.drag { transition: none; }
.panel.sheet .grab { display: block; width: 100%; height: 22px; margin-bottom: -12px; touch-action: none; position: relative; }
.panel.sheet .grab::before { content: ""; position: absolute; left: 50%; top: 6px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--muted); opacity: .45; }
.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel.sheet .x { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; background: var(--surface-2); color: var(--muted); font-size: 18px; flex: none; }
body.locked { overflow: hidden; }
.panel h2 small { font-family: var(--font); color: var(--peach); font-size: 13px; font-weight: 500; margin-left: 6px; vertical-align: 4px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin-bottom: 6px; display: flex; justify-content: space-between; }
input::placeholder { color: var(--muted); opacity: .8; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 6px 6px 6px 10px; }
.row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.row .del { width: 34px; height: 34px; border-radius: 17px; color: var(--muted); font-size: 18px; flex: none; }
.ev { padding-left: 12px; }
.ev .sw { width: 10px; height: 10px; border-radius: 5px; flex: none; }
.ev .time { font-size: 13px; color: var(--muted); flex: none; min-width: 58px; font-variant-numeric: tabular-nums; }
.ev .txt { text-align: left; padding: 6px 0; }
.ev .txt small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.ev.editing { box-shadow: inset 0 0 0 1.5px var(--lav); }
.todo .chk {
  width: 26px; height: 26px; flex: none; border-radius: 13px; box-shadow: inset 0 0 0 1.5px var(--muted);
  display: grid; place-items: center; font-size: 14px; color: var(--on-accent);
}
.todo.done .chk { background: var(--mint); box-shadow: none; }
.todo.done .txt { color: var(--muted); text-decoration: line-through; }
.add { display: flex; gap: 8px; flex-wrap: wrap; }
.add input {
  flex: 1 1 140px; min-width: 0; border: 0; border-radius: 14px; background: var(--surface-2);
  color: var(--fg); font: inherit; padding: 11px 14px;
}
.add input[type="time"] { flex: 0 1 128px; font-size: 15px; }
.add #evTitle { flex-basis: 100%; }
.when { display: flex; gap: 8px; align-items: center; flex: 1 1 100%; min-width: 0; }
.when span { flex: none; width: 26px; font-size: 13px; font-weight: 600; color: var(--muted); }
.add .when input { flex: 1 1 0; min-width: 0; padding: 10px; font-size: 15px; }
.add .when input[type="time"] { flex: 0 1 118px; }
.add .go { background: var(--lav); color: var(--on-accent); border-radius: 14px; padding: 0 16px; flex: none; min-height: 44px; }
.add .cancel { color: var(--muted); padding: 0 10px; min-height: 44px; }
.colors { display: flex; gap: 8px; align-items: center; flex: 1 1 auto; }
.colors button { width: 28px; height: 28px; border-radius: 14px; }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.colors span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 2px 2px 0; }
.foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.note { margin: 0; text-align: center; font-size: 13px; color: var(--muted); min-height: 1em; }
.foot button { font-size: 13px; color: var(--muted); padding: 8px 12px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month"><h1 id="title"></h1><span id="year"></span></div>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <button id="today">오늘</button>
      <button id="next" aria-label="다음 달">›</button>
    </div>
  </header>

  <section class="cal" id="cal" aria-label="달력. 옆으로 밀면 달이 바뀌어요">
    <div class="week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
    <div class="days" id="days"></div>
    <div class="legend"><span><i style="background:var(--peach)"></i>할 일 남음</span><span><i style="background:var(--mint)"></i>할 일 다 했어요</span></div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="panel" id="panel" aria-live="polite">
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div class="head"><h2 id="dayTitle"></h2><button class="x" id="closeSheet" aria-label="닫기">✕</button></div>
    <div>
      <div class="label"><span>일정</span><span id="evCount"></span></div>
      <ul class="list" id="events"></ul>
      <form class="add" id="evForm" style="margin-top:8px">
        <input id="evTitle" placeholder="일정 추가" autocomplete="off" enterkeyhint="done">
        <div class="when"><span>시작</span><input id="evStart" type="date" aria-label="시작 날짜"><input id="evTime" type="time" aria-label="시작 시간 (비우면 하루 종일)"></div>
        <div class="when"><span>끝</span><input id="evEnd" type="date" aria-label="끝 날짜"><input id="evEndTime" type="time" aria-label="끝 시간 (비워도 돼요)"></div>
        <div class="colors" role="group" aria-label="색">
          <span>색</span>
          <button type="button" class="c-lav" data-c="lav" aria-label="라벤더"></button>
          <button type="button" class="c-peach" data-c="peach" aria-label="피치"></button>
          <button type="button" class="c-mint" data-c="mint" aria-label="민트"></button>
          <button type="button" class="c-sky" data-c="sky" aria-label="하늘"></button>
        </div>
        <button type="button" class="cancel" id="evCancel" hidden>취소</button>
        <button type="submit" class="go" id="evSubmit">추가</button>
      </form>
    </div>
    <div>
      <div class="label"><span>할 일</span><span id="count"></span></div>
      <ul class="list" id="todos"></ul>
      <form class="add" id="addForm" style="margin-top:8px">
        <input id="newTodo" placeholder="할 일 추가" autocomplete="off" enterkeyhint="done">
        <button type="submit" class="go">추가</button>
      </form>
    </div>
  </section>

  <div id="scrim" hidden></div>
  <div class="foot">
    <button id="theme">화면 더 어둡게</button>
    <button id="backup">백업 저장</button>
    <button id="restore">백업 불러오기</button>
    <input type="file" id="restoreFile" accept="application/json,.json,text/plain,*/*" hidden>
  </div>
  <p class="note" id="note" aria-live="polite"></p>
</div>

<script>
(function () {
  var KEY = 'cham-calendar-v1';
  var Cap = window.Capacitor;
  var native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  var Prefs = native && Cap.Plugins ? Cap.Plugins.Preferences : null;
  var store = {};

  // 저장: 앱에서는 폰 저장소(Preferences, 위젯도 읽을 수 있음), 웹에서는 브라우저 저장소
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function getItem(k) {
    if (!Prefs) return Promise.resolve(lsGet(k));
    return Prefs.get({ key: k }).then(function (r) { return r && r.value != null ? r.value : lsGet(k); }, function () { return lsGet(k); });
  }
  function setItem(k, v) {
    lsSet(k, v);
    if (Prefs) Prefs.set({ key: k, value: v }).catch(function () {});
  }
  function persist() { setItem(KEY, JSON.stringify(store)); }

  // 대한민국 공휴일 (2026–2027, 대체공휴일 포함)
  var HOL = {
    '2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴',
    '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날',
    '2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일',
    '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일',
    '2026-10-09':'한글날','2026-12-25':'성탄절',
    '2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일',
    '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일',
    '2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
    '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일',
    '2027-12-25':'성탄절','2027-12-27':'대체공휴일'
  };
  var COLORS = ['lav', 'peach', 'mint', 'sky'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var now = new Date();
  var view = new Date(now.getFullYear(), now.getMonth(), 1);
  var sel = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var editing = null;      // 고치는 중인 일정 id
  var color = 'lav';

  var $ = function (id) { return document.getElementById(id); };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];

  // 예전 메모는 하루 종일 일정으로 옮겨요
  function normalize(data) {
    var out = {};
    Object.keys(data || {}).forEach(function (k) {
      var e = data[k];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !e || typeof e !== 'object') return;
      var events = Array.isArray(e.events) ? e.events.map(function (v) {
        var o = { id: String(v.id || uid()), title: String(v.title || ''), time: /^\d{2}:\d{2}$/.test(v.time) ? v.time : '', color: COLORS.indexOf(v.color) >= 0 ? v.color : 'lav' };
        if (/^\d{4}-\d{2}-\d{2}$/.test(v.end) && v.end > k) o.end = v.end;
        if (/^\d{2}:\d{2}$/.test(v.endTime)) o.endTime = v.endTime;
        return o;
      }).filter(function (v) { return v.title.trim(); }) : [];
      if (e.memo && String(e.memo).trim()) events.push({ id: uid(), title: String(e.memo).trim(), time: '', color: 'lav' });
      var todos = Array.isArray(e.todos) ? e.todos.map(function (t) { return { text: String(t.text || ''), done: !!t.done }; }).filter(function (t) { return t.text.trim(); }) : [];
      if (events.length || todos.length) out[k] = { events: events, todos: todos };
    });
    return out;
  }
  function entry(k) { return store[k] || { events: [], todos: [] }; }
  function clean(k) { var e = store[k]; if (e && !e.events.length && !e.todos.length) delete store[k]; }
  function fmtTime(t) {
    if (!t) return '하루 종일';
    var h = +t.slice(0, 2), m = t.slice(3);
    return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + m;
  }

  function md(k) { var p = k.split('-'); return (+p[1]) + '월 ' + (+p[2]) + '일'; }
  // 모든 일정을 기간(시작~끝)으로 펼쳐요. 기간 일정은 시작 날짜에 저장돼 있어요.
  function allSpans() {

    });
    function up(e) {
      if (e.pointerId !== pid) return; pid = null;
      panel.classList.remove('drag'); scrim.style.opacity = '';
      if (dy > 90) closeSheet(); else panel.style.transform = '';
    }
    panel.addEventListener('pointerup', up);
    panel.addEventListener('pointercancel', up);
  })();

  // 자판이 올라오면 입력칸과 그 위 목록이 같이 보이게 스크롤
  var focusedBox = null;
  function showBox() {
    if (!focusedBox) return;
    var vv = window.visualViewport, vh = vv ? vv.height : window.innerHeight;
    var r = focusedBox.getBoundingClientRect(), pad = 12;
    if (sheetOpen) {
      var pr = panel.getBoundingClientRect(), top = Math.max(pr.top, 0), bottom = Math.min(pr.bottom, vh);
      if (r.height + pad * 2 > bottom - top || r.bottom > bottom - pad || r.top < top + pad) panel.scrollTop += r.bottom - bottom + pad;
      return;
    }
    if (r.height + pad * 2 > vh) { // 목록이 길면 입력칸이 자판 바로 위에 오게
      window.scrollBy(0, r.bottom - vh + pad);
    } else if (r.bottom > vh - pad || r.top < pad) {
      window.scrollBy(0, r.bottom - vh + pad);
    }
  }
  document.querySelector('.panel').addEventListener('focusin', function (e) {
    if (e.target.tagName !== 'INPUT') return;
    focusedBox = e.target.closest('.panel > div');
    setTimeout(showBox, 350);
  });
  document.querySelector('.panel').addEventListener('focusout', function () {
    setTimeout(function () { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') focusedBox = null; }, 0);
  });
  (window.visualViewport || window).addEventListener('resize', function () { setTimeout(showBox, 60); });

  window.addEventListener('resize', function () {
    if (compact || (document.activeElement && document.activeElement.tagName === 'INPUT')) return;
    renderGrid();
  });

  setColor('lav'); applyView(); resetEvForm();
  Promise.all([getItem(KEY), getItem(KEY + '-theme')]).then(function (v) {
    var raw = {};
    try { raw = JSON.parse(v[0] || '{}') || {}; } catch (e) { raw = {}; }
    store = normalize(raw);
    if (v[0] && JSON.stringify(store) !== v[0]) persist();
    applyTheme(v[1]);
    render();
  });
  render();
})();
</script>
</body>
</html>
