name: 안드로이드 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # 서명 열쇠(Secret)가 등록돼 있을 때만 APK를 만들어요. 다른 열쇠로 서명하면 폰에 덮어 설치가 안 돼요.
    env:
      HAS_KEY: ${{ secrets.CHAM_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 서명 열쇠 확인
        if: env.HAS_KEY != 'true'
        run: echo "::notice::CHAM_KEYSTORE_BASE64 / CHAM_KEYSTORE_PASSWORD Secret이 없어서 APK 빌드를 건너뛰어요."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: 패키지 설치
        if: env.HAS_KEY == 'true'
        run: npm ci

      - name: 웹 화면을 앱에 넣기
        if: env.HAS_KEY == 'true'
        run: npm run sync

      - name: APK 빌드
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          CHAM_KEYSTORE_PASSWORD: ${{ secrets.CHAM_KEYSTORE_PASSWORD }}
          KEY_B64: ${{ secrets.CHAM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/cham.keystore"
          export CHAM_KEYSTORE_PATH="$RUNNER_TEMP/cham.keystore"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../cham-calendar.apk

      - name: 다운로드 링크에 올리기
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 챔의 달력 (최신)
          body: |
            휴대폰에서 아래 cham-calendar.apk 를 눌러 받고 설치하세요.
            고정 링크: https://github.com/${{ github.repository }}/releases/latest/download/cham-calendar.apk
          files: cham-calendar.apk
          make_latest: true
